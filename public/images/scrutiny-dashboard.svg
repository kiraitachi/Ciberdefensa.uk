<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" aria-label="Scrutiny SMART drive monitoring dashboard" role="img">
  <rect width="720" height="200" fill="#0a121c" rx="8"/>
  <text x="30" y="30" font-family="IBM Plex Mono,monospace,sans-serif" font-size="13" font-weight="600" fill="#ff9d3d">Scrutiny Dashboard — SMART Monitor</text>
  <text x="30" y="50" font-family="IBM Plex Mono,monospace,sans-serif" font-size="10" fill="#94a7bb">Proxmox host drive status + historical trend (temperature / reallocated / health)</text>

  <!-- Cards per drive -->
  <rect x="30" y="70" width="140" height="100" rx="3" fill="#101c29" stroke="#223247"/>
  <text x="100" y="95" text-anchor="middle" fill="#e9eef5" font-family="Space Grotesk,sans-serif" font-size="12" font-weight="600">/dev/nvme0</text>
  <text x="100" y="115" text-anchor="middle" fill="#ff9d3d" font-family="IBM Plex Mono,monospace" font-size="11">Health: PASS</text>
  <text x="100" y="130" text-anchor="middle" fill="#94a7bb" font-size="9">Temp: 42C · Realloc: 0</text>
  <text x="100" y="145" text-anchor="middle" fill="#94a7bb" font-size="9">Power-on: 12,340 h</text>
  <rect x="60" y="150" width="80" height="10" rx="2" fill="#ff9d3d"/>

  <rect x="200" y="70" width="140" height="100" rx="3" fill="#101c29" stroke="#223247"/>
  <text x="270" y="95" text-anchor="middle" fill="#e9eef5" font-family="Space Grotesk,sans-serif" font-size="12" font-weight="600">/dev/sda</text>
  <text x="270" y="115" text-anchor="middle" fill="#ff9d3d" font-family="IBM Plex Mono,monospace" font-size="11">Health: PASS</text>
  <text x="270" y="130" text-anchor="middle" fill="#94a7bb" font-size="9">Temp: 38C · Realloc: 0</text>
  <text x="270" y="145" text-anchor="middle" fill="#94a7bb" font-size="9">Power-on: 8,900 h</text>
  <rect x="230" y="150" width="80" height="10" rx="2" fill="#ff9d3d"/>

  <rect x="370" y="70" width="140" height="100" rx="3" fill="#101c29" stroke="#223247"/>
  <text x="440" y="95" text-anchor="middle" fill="#e9eef5" font-family="Space Grotesk,sans-serif" font-size="12" font-weight="600">/dev/sdb</text>
  <text x="440" y="115" text-anchor="middle" fill="#ff9d3d" font-family="IBM Plex Mono,monospace" font-size="11">Health: PASS</text>
  <text x="440" y="130" text-anchor="middle" fill="#94a7bb" font-size="9">Temp: 41C · Realloc: 0</text>
  <text x="440" y="145" text-anchor="middle" fill="#94a7bb" font-size="9">Power-on: 15,100 h</text>
  <rect x="400" y="150" width="80" height="10" rx="2" fill="#ff9d3d"/>

  <rect x="540" y="70" width="140" height="100" rx="3" fill="#101c29" stroke="#223247"/>
  <text x="610" y="95" text-anchor="middle" fill="#e9eef5" font-family="Space Grotesk,sans-serif" font-size="12" font-weight="600">Trend</text>
  <text x="610" y="115" text-anchor="middle" fill="#ff9d3d" font-family="IBM Plex Mono,monospace" font-size="11">SMART 5·05</text>
  <text x="610" y="130" text-anchor="middle" fill="#94a7bb" font-size="9">Reallocated sectors</text>
  <text x="610" y="145" text-anchor="middle" fill="#94a7bb" font-size="9">Temperature over 30 days</text>
  <line x1="560" y1="155" x2="660" y2="155" stroke="#ff9d3d" stroke-width="2"/>
  <circle cx="580" cy="150" r="3" fill="#ff9d3d"/>
  <circle cx="620" cy="140" r="3" fill="#ff9d3d"/>
  <circle cx="660" cy="155" r="3" fill="#ff9d3d"/>
</svg>